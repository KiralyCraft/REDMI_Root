# Redmi Pad Pro / POCO Pad (dizi / 2405CRPFDC), China HyperOS 1.0.19.0.UNSCNXM,
# Android 14. Target kernel: 5.10.209-android12-9-00019-g4ea09a298bb4-ab12292661.
#
# Derived OFFLINE from the device's real Image, not from a CI artifact: build
# 12292661 is gone from ci.android.com, so values come from the official OTA
# (miui_DIZI_OS1.0.19.0.UNSCNXM_ec70c6dda2_14.0.zip, MD5 ec70c6dda28ff46dfdb84d03cb5cef87)
# -> payload.bin (CrAU v2) -> boot_a.img -> raw arm64 Image. A hermetic rebuild of
# the exact commit with clang-r416183b + the device .config was used only as a
# struct-layout oracle (pahole) and is NOT byte-identical to the CI build.
#
# Symbol values below were decoded from the Image's own kallsyms blob (5.10
# layout: offsets -> relative_base -> num_syms -> names -> markers -> token table
# -> token index) and cross-checked by three independent pointer chases:
#   init_task 0x279bec0 (comm@1936 = "swapper", pid@1480 = 0, prio@132 = 120,
#                        flags@0 = 8, sched_task_group@784 -> root_task_group)
#   init_cred 0x27b0ae0 (usage@0 = 4, uid@4 = 0, full caps at 48..64,
#                        user/user_ns/group_info at 128/136/144)
#   root_task_group 0x2992040 (reached from init_task, listed in kallsyms)
# All three decoded entries match their kallsyms indices exactly.
#
# Cross-check against the known-good 236 profile: every one of its offset-block
# values is within +-0x6A08 of the values here (its own build is a later
# HyperOS 3 / 5.10.236), and the cred ref0/1/2 triple is exactly +0x80 shifted
# with group_info pinned at init_cred+0xA8 in both builds.
#
# SELinux: 5.10 keeps the enforcing flag inside `struct selinux_state`
# (CONFIG_SECURITY_SELINUX_DISABLE is not set, RANDSTRUCT off), where
# `bool enforcing` is field 0; the profile value is therefore the address of
# `selinux_state` itself.
#
# Route geometry: select_stack, device bytes (not the rebuild) verified from the
# real Image at the kallsyms offsets (file offset = DWARF - 0xF000):
#   pselect: __arm64_sys_pselect6 `sub sp, sp, #0xa0`
#            core_sys_select    `sub sp, sp, #0x1c0`, stack_fds `add x21, sp, #0x50`
#            -> absolute S0 - 0x210
#   futex:   __arm64_sys_futex  `sub sp, sp, #0x90`
#            do_futex           `sub sp, sp, #0x70`
#            futex_wait_requeue_pi `sub sp, sp, #0x1a0`, waiter `add x27, sp, #0x90`
#            -> absolute S0 - 0x210
#   delta = 0 -> shift 0 -> waiter_shift = -2 (same absolute stack word reuse).
# CVE-2026-43499 primitive: remove_waiter() at 0x1ea7a0 retains the unpatched
# `current->pi_blocked_on = NULL` form (fix 3bfdc63936dd never backported to 5.10).
#
# CONFIRMED on device (2026-10-28): kernel_phys_load = 0xa8000000 — the rooted
# /proc/iomem dump shows "Kernel code" at a8000000-aa47ffff and System RAM
# starting at 0x808f4000, so kernel_phys_offset = null (default 0x80000000) holds.
# STILL UNCONFIRMED: the skb reclaim geometry (skb_reclaim_sends = 16,
# skb_frag_bias = 384, same 5.10 unix-sendmsg code); only a passing gate run
# settles it.
